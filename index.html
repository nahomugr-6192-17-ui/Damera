<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="ዳmeラ — Keep the Fire Burning. A Meskel celebration browser game." />
  <title>🔥ዳmeラ🔥</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700;900&family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(56,142,60,0.4) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 50%, rgba(27,94,32,0.5) 0%, transparent 55%),
        linear-gradient(180deg, #1b5e20 0%, #2e7d32 45%, #33691e 100%);
      font-family: 'Nunito', 'Noto Sans Ethiopic', sans-serif;
    }

    /* ── Game container: fixed, fills full viewport — NO flexbox so Phaser RESIZE works ── */
    #game-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }

    /* Phaser canvas fills the container completely */
    #game-container canvas {
      display: block;
      touch-action: none;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Portrait rotation warning (phones < 768px in portrait) ── */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: #1b5e20;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 32px;
    }
    #rotate-prompt .icon { font-size: 72px; animation: rp 1.2s ease-in-out infinite alternate; }
    #rotate-prompt h2 { font-size: 24px; margin-top: 16px; color: #ffee58; font-family: 'Fredoka One', sans-serif; }
    #rotate-prompt p  { font-size: 15px; margin-top: 10px; color: #c8e6c9; line-height: 1.5; }
    @keyframes rp { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }

    /* Show rotate prompt only on small portrait screens */
    @media screen and (max-width: 600px) and (orientation: portrait) {
      #rotate-prompt { display: flex; }
    }

    /* ── Mobile controls — hidden by default, shown only during GameScene ── */
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 170px;
      pointer-events: none;
      z-index: 500;
    }

    /* Joystick zone */
    #joystick-zone {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      pointer-events: all;
      touch-action: none;
    }
    #joystick-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(6px);
    }
    #joystick-thumb {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffee58, #e65100);
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Action button */
    #action-btn {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #81c784, #2e7d32);
      border: 4px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      color: #fff;
      font-family: 'Fredoka One', sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s, box-shadow 0.08s;
      border: none;
      outline: none;
    }
    #action-btn.pressed  { transform: scale(0.90); box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #action-btn.carrying { background: radial-gradient(circle at 35% 35%, #ef9a9a, #c62828); }
  </style>
</head>

<body>
  <!-- Portrait rotation warning -->
  <div id="rotate-prompt">
    <div class="icon">📱</div>
    <h2>Please Rotate Your Device</h2>
    <p>ዳmeラ plays best in <strong>landscape mode</strong>.<br/>Turn your phone sideways to continue.</p>
  </div>

  <!-- Phaser canvas container -->
  <div id="game-container"></div>

  <!-- Mobile controls — shown only during GameScene via JS -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-thumb"></div>
    </div>
    <button id="action-btn" type="button">PICK</button>
  </div>

  <script>
    // Global state bridge between HTML controls and Phaser
    window.__jx              = 0;
    window.__jy              = 0;
    window.__actionPressed   = false;
    window.__isCarryingWood  = false;

    const zone      = document.getElementById('joystick-zone');
    const thumb     = document.getElementById('joystick-thumb');
    const actionBtn = document.getElementById('action-btn');
    const RADIUS    = 36;

    let activeTouchId = null;
    let zoneRect      = null;

    function getCenter() {
      if (!zoneRect) zoneRect = zone.getBoundingClientRect();
      return { cx: zoneRect.left + zoneRect.width / 2, cy: zoneRect.top + zoneRect.height / 2 };
    }

    function resetJoystick() {
      window.__jx = 0;
      window.__jy = 0;
      thumb.style.transform = 'translate(-50%,-50%)';
      activeTouchId = null;
    }

    zone.addEventListener('touchstart', e => {
      e.preventDefault();
      zoneRect = zone.getBoundingClientRect();
      if (activeTouchId === null) activeTouchId = e.changedTouches[0].identifier;
    }, { passive: false });

    zone.addEventListener('touchmove', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== activeTouchId) continue;
        const { cx, cy } = getCenter();
        let dx = t.clientX - cx;
        let dy = t.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > RADIUS) { dx = dx / dist * RADIUS; dy = dy / dist * RADIUS; }
        thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        window.__jx = dx / RADIUS;
        window.__jy = dy / RADIUS;
      }
    }, { passive: false });

    zone.addEventListener('touchend',    e => { for (const t of e.changedTouches) if (t.identifier === activeTouchId) resetJoystick(); });
    zone.addEventListener('touchcancel', e => { for (const t of e.changedTouches) if (t.identifier === activeTouchId) resetJoystick(); });
    window.addEventListener('resize', () => { zoneRect = null; });

    actionBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      window.__actionPressed = true;
      actionBtn.classList.add('pressed');
    }, { passive: false });
    actionBtn.addEventListener('touchend', e => {
      e.preventDefault();
      actionBtn.classList.remove('pressed');
    }, { passive: false });
    // Desktop fallback
    actionBtn.addEventListener('mousedown', () => { window.__actionPressed = true; });
    actionBtn.addEventListener('mouseup',   () => { actionBtn.classList.remove('pressed'); });

    // Continuously sync button label/color from GameScene state
    (function tick() {
      const carrying = !!window.__isCarryingWood;
      actionBtn.textContent = carrying ? 'DROP' : 'PICK';
      carrying ? actionBtn.classList.add('carrying') : actionBtn.classList.remove('carrying');
      requestAnimationFrame(tick);
    })();
  </script>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
