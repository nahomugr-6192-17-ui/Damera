<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="ዳመራ — Keep the Fire Burning. A Meskel celebration browser game." />
    <title>ዳመራ — Keep the Fire Burning</title>

    <!-- Noto Sans Ethiopic: Amharic character support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700;900&family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;

        /* Rich green background — matches game's forest theme.
           On desktop this fills the side areas around the canvas
           instead of the previous dark navy, making it look intentional. */
        background:
          radial-gradient(ellipse at 15% 50%, rgba(56, 142, 60, 0.4) 0%, transparent 55%),
          radial-gradient(ellipse at 85% 50%, rgba(27, 94, 32, 0.5) 0%, transparent 55%),
          linear-gradient(180deg, #1b5e20 0%, #2e7d32 45%, #33691e 100%);

        display: flex;
        align-items: center;
        justify-content: center;

        font-family: 'Nunito', 'Noto Sans Ethiopic', sans-serif;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* On desktop give the canvas a subtle shadow so it looks
         like a polished window against the green background */
      canvas {
        display: block;
        touch-action: none;
        border-radius: 4px;
        box-shadow:
          0 0 0 2px rgba(255,255,255,0.06),
          0 8px 48px rgba(0, 0, 0, 0.55),
          0 0 80px rgba(46, 125, 50, 0.25);
      }

      /* Decorative side panels on wide desktop screens */
      @media (min-aspect-ratio: 3/4) and (min-width: 900px) {
        body::before,
        body::after {
          content: '';
          position: fixed;
          top: 0;
          width: 18%;
          height: 100%;
          pointer-events: none;
          z-index: 0;
        }
        body::before {
          left: 0;
          background:
            radial-gradient(ellipse at 30% 70%, rgba(27, 94, 32, 0.8) 0%, transparent 60%),
            radial-gradient(ellipse at 60% 30%, rgba(56, 142, 60, 0.5) 0%, transparent 50%);
        }
        body::after {
          right: 0;
          background:
            radial-gradient(ellipse at 70% 65%, rgba(27, 94, 32, 0.8) 0%, transparent 60%),
            radial-gradient(ellipse at 40% 25%, rgba(56, 142, 60, 0.5) 0%, transparent 50%);
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
